name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wayback flow
        run: |
          pip -q install requests
          python - <<'EOF'
          import requests, time
          UA = {"User-Agent": "econ-calendar/1.0 (github.com/AbodhGawande/econ-calendar)"}
          ISM = "https://www.ismworld.org/supply-management-news-and-reports/reports/rob-report-calendar/"
          JOLTS = "https://www.bls.gov/schedule/news_release/jolts.htm"

          # 1. Can we trigger a fresh capture? (best-effort)
          for u in (ISM, JOLTS):
              try:
                  r = requests.get(f"https://web.archive.org/save/{u}", headers=UA, timeout=120)
                  print("SPN", u.split("/")[2], r.status_code, len(r.text))
              except Exception as e:
                  print("SPN", u.split("/")[2], "EXC", type(e).__name__, str(e)[:100])

          # 2. CDX newest snapshots
          for u in (ISM, JOLTS):
              r = requests.get("https://web.archive.org/cdx/search/cdx",
                               params={"url": u, "output": "json", "filter": "statuscode:200",
                                       "limit": "-4", "fl": "timestamp"},
                               headers=UA, timeout=60)
              print("CDX", u.split("/")[2], r.status_code, r.json())

          # 3. Raw snapshot fetch (id_ = original bytes)
          r = requests.get(f"https://web.archive.org/web/20260415040000id_/{ISM}", headers=UA, timeout=60)
          print("SNAP ism", r.status_code, len(r.text), "Manufacturing PMI" in r.text, "captcha" in r.text.lower())
          r = requests.get(f"https://web.archive.org/web/20260612174939id_/{JOLTS}", headers=UA, timeout=60)
          print("SNAP jolts", r.status_code, len(r.text), "Reference Month" in r.text, "Access Denied" in r.text)
          EOF
