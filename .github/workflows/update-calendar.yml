name: Update calendar

on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday 12:00 UTC
    - cron: "0 12 * * 4"   # Thursday backup attempt (no-op commit-wise if Monday succeeded)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fails nonzero (and the run goes red) if a source is unreachable,
      # blocked, fails to parse, or the generated file fails validation.
      - name: Generate calendar
        run: python generate_calendar.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- us-econ-ism-jolts.ics; then
            echo "Calendar unchanged; nothing to commit."
            exit 0
          fi
          ADDED=$(git diff -- us-econ-ism-jolts.ics | grep '^+UID:' | sed 's/^+UID://;s/@econ-cal//' | tr -d '\r' | paste -sd ', ' -)
          REMOVED=$(git diff -- us-econ-ism-jolts.ics | grep '^-UID:' | sed 's/^-UID://;s/@econ-cal//' | tr -d '\r' | paste -sd ', ' -)
          MSG="Update calendar:"
          [ -n "$ADDED" ] && MSG="$MSG added $ADDED."
          [ -n "$REMOVED" ] && MSG="$MSG removed $REMOVED."
          [ "$MSG" = "Update calendar:" ] && MSG="Update calendar: event details changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-econ-ism-jolts.ics
          git commit -m "${MSG:0:400}"
          git push
